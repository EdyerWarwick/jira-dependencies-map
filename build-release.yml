name: Build Jira Dependency Map

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set application version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            "0.0.$env:GITHUB_RUN_NUMBER"
          }

          $file = "jira_dependency_map_v33.py"
          $content = Get-Content $file -Raw
          $content = $content -replace 'APP_VERSION="[^"]+"', "APP_VERSION=`"$version`""
          Set-Content $file $content -Encoding UTF8

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm jira_dependency_map.spec

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jira-Dependency-Map-Windows
          path: dist/Jira-Dependency-Map.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/Jira-Dependency-Map.exe" `
            --title "Jira Dependency Map $env:GITHUB_REF_NAME" `
            --generate-notes
