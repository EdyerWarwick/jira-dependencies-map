name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Set application version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            $version = "v1.0.0"
          }

          $path = "jira_dependency_map_v33.py"
          $content = Get-Content $path -Raw
          $content = [regex]::Replace(
            $content,
            'APP_VERSION="[^"]*"',
            ('APP_VERSION="' + $version.Substring(1) + '"'),
            1
          )
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Build application and launcher
        run: |
          python -m PyInstaller --clean --noconfirm jira_dependency_map.spec
          python -m PyInstaller --clean --noconfirm jira_dependency_map_launcher.spec

      - name: Package versioned application
        shell: pwsh
        run: |
          $zip = "dist/Jira-Dependency-Map-win64.zip"
          Compress-Archive `
            -Path "dist/Jira-Dependency-Map/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  Jira-Dependency-Map-win64.zip" |
            Set-Content -Path "$zip.sha256" -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jira-Dependency-Map-release
          path: |
            dist/Jira-Dependency-Map.exe
            dist/Jira-Dependency-Map-win64.zip
            dist/Jira-Dependency-Map-win64.zip.sha256

      - name: Upload assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" `
            "dist/Jira-Dependency-Map.exe" `
            "dist/Jira-Dependency-Map-win64.zip" `
            "dist/Jira-Dependency-Map-win64.zip.sha256" `
            --clobber
